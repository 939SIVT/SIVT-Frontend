<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SIVT 科學探究虛擬教師 - 引導學生進行科學探究學習">
    <title>SIVT 科學探究虛擬教師</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- 登入對話框 -->
    <div class="login-overlay" id="login-overlay">
        <div class="login-dialog">
            <div class="login-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
            <h2>歡迎使用 SIVT</h2>
            <p>請輸入你的名稱以開始探究對話</p>
            <input type="text" id="username-input" placeholder="請輸入名稱..." maxlength="20" autocomplete="off">
            <button id="login-btn" class="login-submit-btn">開始探究</button>
            <p class="login-hint">你的對話記錄將會被儲存以供學習分析</p>
        </div>
    </div>

    <div class="app-container">
        <!-- 側邊欄 -->
        <aside class="sidebar">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2L2 7l10 5 10-5-10-5z" />
                        <path d="M2 17l10 5 10-5" />
                        <path d="M2 12l10 5 10-5" />
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>SIVT</h1>
                    <span>科學探究虛擬教師</span>
                </div>
            </div>

            <div class="divider"></div>

            <!-- 探究歷程指示 -->
            <div class="inquiry-phases">
                <h3>探究歷程</h3>
                <ul class="phase-list">
                    <li class="phase-item" data-phase="1">
                        <span class="phase-number">1</span>
                        <span class="phase-name">發現問題</span>
                    </li>
                    <li class="phase-item" data-phase="2">
                        <span class="phase-number">2</span>
                        <span class="phase-name">規劃與研究</span>
                    </li>
                    <li class="phase-item" data-phase="3">
                        <span class="phase-number">3</span>
                        <span class="phase-name">論證與建模</span>
                    </li>
                    <li class="phase-item" data-phase="4">
                        <span class="phase-number">4</span>
                        <span class="phase-name">表達與分享</span>
                    </li>
                </ul>
            </div>

            <div class="divider"></div>

            <!-- AI 模型選擇 -->
            <div class="model-section">
                <label for="model-select">AI 模型</label>
                <select id="model-select">
                    <option value="azure">Azure OpenAI</option>
                    <option value="openai">OpenAI GPT</option>
                </select>
            </div>

            <div class="divider"></div>

            <!-- 影片上傳模組 -->
            <div class="video-section">
                <h3>探究影片</h3>
                <div class="upload-container">
                    <input type="file" id="video-upload" accept="video/*" style="display: none;">
                    <button class="upload-btn" id="upload-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="17 8 12 3 7 8" />
                            <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                        <span>上傳影片</span>
                    </button>
                    <div class="video-status" id="video-status" style="display: none;">
                        <span class="status-msg">準備中...</span>
                    </div>
                </div>
            </div>

            <!-- 狀態指示 -->
            <div class="status-section">
                <div class="status-indicator" id="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">檢查連線中...</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="clear-btn" id="clear-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3,6 5,6 21,6" />
                        <path d="M19,6v14a2,2,0,0,1-2,2H7a2,2,0,0,1-2-2V6M8,6V4a2,2,0,0,1,2-2h4a2,2,0,0,1,2,2V6" />
                    </svg>
                    <span>清除對話</span>
                </button>
            </div>
        </aside>

        <!-- 主要內容區 -->
        <main class="main-content">
            <!-- 頂部標題列 -->
            <header class="chat-header">
                <div class="header-info">
                    <h2>探究對話室</h2>
                    <p>我會引導你進行科學探究思考</p>
                </div>
            </header>

            <!-- 分割佈局容器 -->
            <div class="split-layout" id="split-layout">
                <!-- 左側：影片播放區 (預設隱藏) -->
                <div class="video-panel" id="video-panel" style="display: none;">
                    <div class="video-wrapper">
                        <video id="main-player" controls preload="metadata">
                            Your browser does not support the video tag.
                        </video>
                        <!-- 專業版處理狀態遮罩 -->
                        <div class="status-overlay" id="status-overlay" style="display: none;">
                            <div class="processing-container">
                                <div class="spinner-ring"></div>
                                <div class="status-content">
                                    <h3 class="status-title">AI 分析運算中</h3>
                                    <div class="progress-steps">
                                        <div class="progress-step" id="step-transcribe">
                                            <div class="step-indicator"></div>
                                            <span>語音內容解析</span>
                                        </div>
                                        <div class="progress-step" id="step-extract">
                                            <div class="step-indicator"></div>
                                            <span>畫面萃取與視覺分析</span>
                                        </div>
                                        <div class="progress-step" id="step-ingest">
                                            <div class="step-indicator"></div>
                                            <span>RAG資料庫建構</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 拖曳調整桿 -->
                <div class="resizer" id="resizer"></div>

                <!-- 右側：聊天區 -->
                <div class="chat-panel">
                    <div class="chat-container" id="chat-container">
                        <div class="welcome-section">
                            <div class="welcome-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M12 16v-4M12 8h.01" />
                                </svg>
                            </div>
                            <h2>歡迎來到科學探究教室</h2>
                            <p>我是你的虛擬科學教師，將引導你完成探究學習的四大歷程</p>
                            <div class="quick-start">
                                <p class="hint">你可以嘗試這樣開始：</p>
                                <div class="suggestion-chips">
                                    <button class="chip" data-message="我想開始進行科學探究">開始探究</button>
                                    <button class="chip" data-message="什麼是科學探究？">什麼是探究?</button>
                                    <button class="chip" data-message="請說明探究的四個歷程">四大歷程</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 輸入區 -->
                    <div class="input-container">
                        <div class="input-wrapper">
                            <!-- 檔案上傳按鈕 -->
                            <button id="attachment-btn" class="icon-btn" title="上傳影片/圖片">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                                </svg>
                            </button>
                            <input type="file" id="file-upload" accept="video/*,image/*,.txt,.pdf,.docx,.md,.csv,.json"
                                style="display: none;">

                            <textarea id="message-input" placeholder="輸入訊息..." rows="1"></textarea>

                            <button id="voice-btn" class="icon-btn" title="語音輸入 (按住錄音)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                                    <line x1="12" y1="19" x2="12" y2="23" />
                                    <line x1="8" y1="23" x2="16" y2="23" />
                                </svg>
                            </button>
                            <button id="send-btn" class="send-btn" title="發送訊息">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13" />
                                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                                </svg>
                            </button>
                        </div>
                        <p class="input-hint">若是詢問問題，請使用 Shift + Enter 換行</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js?v=3"></script>
</body>

</html>
